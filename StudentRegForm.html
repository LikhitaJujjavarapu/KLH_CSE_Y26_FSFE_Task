
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration form</title>
</head>
<body bgcolor="lightblue">
    <header>
    <h2 style="color:cadetblue; text-align:center"><font face="Calibri">Student Registration form</font></h2>
    </header>
    <section>
        
        <div style="text-align:center; width:50%; margin:auto; border-color:black" border="5">
            <h3 style="color:cadetblue;">Registration Form</h3>
    <form style="background-color:azure">
        <label style="color:cadetblue"><b>Student Name:</b></label>
        <input type="text" name="name" placeholder="Enter Name">
        <br><br>
        <label style="color:cadetblue"><b>Email:</b></label>
        <input type="email" name="email">
        <br><br>
        <label style="color:cadetblue"><b>Password:</b></label>
        <input type="number" name="password">
        <br><br>
        <label style="color:cadetblue"><b>Age:</b></label>
        <input type="number" name="age">
        <br><br>
        <label style="color:cadetblue"><b>Gender:</b></label>
        <input type="radio" name="gender">Male
        <input type="radio" name="gender">Female

        <br><br>
        <label style="color:cadetblue"><b>Skills:</b></label>
        <input type="checkbox" name="skill">HTML
        <input type="checkbox" name="skill">CSS
        <input type="checkbox" name="skill">Java
        <br><br>
        <label style="color:cadetblue"><b>Date of Birth:</b></label>
        <input type="date" name="dob">
        <br><br>
        <label style="color:cadetblue"><b>Department:</b></label>
        <select name="department">
            <option>CSE</option>
            <option>ECE</option>
            <option>IT</option>
            <option>EEE</option>
        </select>
        <br><br>
        <label style="color:cadetblue"><b>Address:</b></label>
        <textarea rows="4" cols="30" placeholder="Enter your address" required midlength="10"></textarea>
    <br><br>
    <input type="submit" value="Register">
    <input type="reset" value="Clear">
    </form>
    </div>
    </section>
</body>
</html>
